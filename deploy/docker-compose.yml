# Запуск:  docker compose up -d --build
services:
  cappi-core:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: cappi-core
    container_name: cappi-core
    restart: unless-stopped        # поднимется сам после ребута сервера
    logging:
      # Без ограничения docker пишет журнал бесконечно: бот болтливый,
      # и за год это гигабайты на диске сервера, который делит место с
      # Джамшутом и базой.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      # Дублирует ENV TZ из Dockerfile нарочно. Время отчётов считается по
      # местному: итоги дня в 22:30 — это 22:30 в Одессе, а сервер живёт в
      # UTC. Цена ошибки — отчёт в половине второго ночи, поэтому пояс
      # задан в обоих местах.
      TZ: Europe/Kyiv
    ports:
      # Только localhost, как у соседнего бота: наружу приёмник событий
      # пойдёт через nginx с TLS, если понадобится. Сейчас события зон
      # забираются опросом, и порт нужен на будущее.
      - "127.0.0.1:8787:8787"
    volumes:
      # Состояние на хосте: конфиг с доступами, план, журнал цен, роли,
      # события зон. Внутри образа оно стиралось бы при каждой пересборке,
      # а журнал цен ценен именно на длинной дистанции.
      # Путь от папки с этим файлом, а не от корня проекта: ./data здесь
      # означало бы deploy/data, и конфиг в контейнер не попал бы.
      - ../data:/root/.cappi
    # Сервер общий, соседи чужие. Файловая система только для чтения —
    # бот пишет лишь в ~/.cappi (том) и /tmp; права и capabilities не
    # нужны: он не слушает привилегированных портов и не меняет систему.
    # Лимит процессора cgroup у rootless-докера не отдаёт — только память.
    read_only: true
    tmpfs:
      - /tmp:size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    pids_limit: 128
